[package]
name = "openvtc-core"
description = "OpenVTC Core Library"
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
license.workspace = true
repository.workspace = true

[features]
default = ["openpgp-card"]
openpgp-card = [
  "dep:openpgp-card",
  "dep:card-backend-pcsc",
  "dep:openpgp-card-rpgp",
]
# Derives `Arbitrary` on the pure parse-surface config/message/credential
# types so the cargo-fuzz harnesses can do structure-aware fuzzing
# (issue #124). Off by default; nightly fuzz builds opt in. Pulls chrono's
# own `arbitrary` feature for the `LogMessage` timestamp.
arbitrary = ["dep:arbitrary", "chrono/arbitrary"]

[dependencies]
aes-gcm.workspace = true
anyhow.workspace = true
arbitrary = { workspace = true, optional = true }
argon2.workspace = true
affinidi-tdk.workspace = true
affinidi-data-integrity.workspace = true
affinidi-did-resolver-cache-sdk.workspace = true
# Both promoted from dev-dependencies when the DIDComm transport module moved
# here from the `openvtc` binary crate (#189) — `crate::didcomm` wraps
# `DIDCommService` and takes a `CancellationToken` for shutdown, so these are now
# real dependencies rather than test-only scaffolding.
affinidi-messaging-didcomm-service = { workspace = true }
tokio-util = { workspace = true }
agent-names.workspace = true
base64.workspace = true
bip39.workspace = true
byteorder.workspace = true
chrono.workspace = true
dirs.workspace = true
didwebvh-rs.workspace = true
dtg-credentials.workspace = true
ed25519-dalek-bip32.workspace = true
hkdf.workspace = true
hex.workspace = true
keyring-core.workspace = true
multibase.workspace = true
pgp.workspace = true
rand.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
trust-tasks-rs.workspace = true
trust-tasks-capability-client.workspace = true
url.workspace = true
uuid.workspace = true
x25519-dalek.workspace = true
vta-sdk.workspace = true
zeroize.workspace = true

# Openpgp-Card Support
openpgp-card = { workspace = true, optional = true }
card-backend-pcsc = { workspace = true, optional = true }
openpgp-card-rpgp = { workspace = true, optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
# `didcomm::catch_all_tests` compiles the router's catch-all pattern to assert
# which message types reach the handler at all — test-only, so a dev-dependency.
regex = { workspace = true }
# In-process mediator for integration tests. `memory-backend` keeps the
# whole mediator (config + queue + secrets) in RAM — no Redis sidecar,
# no on-disk fixtures — so `cargo test` stays self-contained. Slow tests
# that spawn the mediator are marked `#[ignore]`; run them with
# `cargo test -- --ignored`.
# Test-mediator fixture: spawns a real `affinidi-messaging-mediator`
# embedded in the test process with the JWT keys, DID document, ACL
# defaults, and local-DID whitelisting set up. Replaces the hand-rolled
# harness that did the same dance manually.
affinidi-messaging-test-mediator = "0.2"
# The delivery layer, for the integration harness. The harness has to move with
# the production code: it builds its own messaging stack, so tests left on the old
# framework would keep passing while covering none of the migrated path.
affinidi-messaging-delivery = { workspace = true }
affinidi-messaging-core = { workspace = true }
affinidi-messaging-sdk = { workspace = true }
futures-util = { workspace = true }
# In-process MockVta for the bootstrap e2e (VTI#406/#427 test-support seams).
# `vta-service` is the VTA server crate; it carries the credential-vault
# lifecycle tasks (receive/query/archive/delete/restore/purge) + the
# `MockVta::start_provisionable` seams used by the e2e tests. 0.11 is the
# line built against vta-sdk 0.19 — 0.10.25 no longer compiles against the
# current vti-common.
vta-service = { version = "0.11", default-features = false, features = ["test-support", "rest", "didcomm"] }
base64 = { workspace = true }
ed25519-dalek-bip32 = { workspace = true }
secrecy = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Mock HTTP server for the agent-name resolve→verify e2e: it serves the
# `/@name` → 302 → DID redirect the `HttpRedirectResolver` follows, so the whole
# chain is exercised without a live host.
wiremock = "0.6"
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[[bench]]
name = "crypto"
harness = false

# The vta-service dev-dependency drags webauthn-rs -> openssl-sys into every
# `cargo test` build. Hosted Windows runners ship no MSVC-linkable OpenSSL,
# so build the vendored copy there; feature unification applies it to the
# whole graph. Linux/macOS keep linking the system library.
[target.'cfg(windows)'.dev-dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }
